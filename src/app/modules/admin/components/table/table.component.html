<table class="table">
    <thead>
        <tr>
            <th class="tabla-titulo" scope="col">#</th>
            <th class="tabla-titulo" scope="col">Imagen</th>
            <th class="tabla-titulo" scope="col">Nombre</th>
            <th class="tabla-titulo" scope="col">Precio</th>
            <th class="tabla-titulo" scope="col">descripcion</th>
            <th class="tabla-titulo" scope="col">Categoria</th>
            <th class="tabla-titulo" scope="col">Stock</th>
            <th class="tabla-titulo" scope="col">Acciones</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let producto of coleccionProductos">
            <th scope="row">i</th>
            <td>
                <img src="{{producto.imagen}}" alt="{{producto.alt}}" width="100px">
            </td>
            <td>{{producto.nombre}}</td>
            <td>{{producto.precio}}</td>
            <td>{{producto.descripcion}}</td>
            <td>{{producto.categoria}}</td>
            <td>{{producto.stock}}</td>

            <!-- ACCIONES -->
            <!-- EDITAR -->
            <td>
                <button id="btn-edit" title="Editar" type="button" class="btn btn-outline-writing"
                    data-bs-toggle="modal" data-bs-target="#editarProducto" (click)="mostrarEditar(producto)">
                    <mat-icon>edit</mat-icon>
                </button>
            </td>
            <td>
                <!-- ELIMINAR -->
                <button id="btn-delete" tittle="Eliminar" type="button" class="btn btn-outline-danger"
                    data-bs-toggle="modal" data-bs-target="#eliminarProducto" (click)="mostrarBorrar(producto)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </tr>
    </tbody>
</table>

<!-- Boton para agregar productos -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#agregarProducto">
    Agregar un nuevo producto
</button>

<!-- Modal para agregar productos -->
<div class="modal fade" id="agregarProducto" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Ingrese un nuevo producto</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <!-- cuerpo del modal -->
            <div [formGroup]="producto" class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Ingrese el nombre del producto</label>
                    <input class="form-control" type="text" formControlName="nombre" placeholder="Ej: Labial rojo">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ingrese descripcion del producto</label>
                    <input class="form-control" type="text" formControlName="descripcion">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ingrese el precio del producto</label>
                    <input class="form-control" type="number" formControlName="precio" placeholder="...">
                </div>

                <div class="mb-3">
                    <label class="form-label">Seleccione una categoria</label>
                    <select class="form-control" class="form-select" formControlName="categoria">
                        <option selected>Elija una opcion</option>
                        <option value="labiales">Labiales</option>
                        <option value="ojos">Ojos</option>
                        <option value="rostro">Rostro</option>
                        <option value="unas">Uñas</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ingrese una imagen</label>
                    <input class="form-control" type="text" formControlName="imagen"
                        placeholder="Ingrese vinculo de una imagen">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ingrese un texto alternativo</label>
                    <input class="form-control" type="text" formControlName="alt"
                        placeholder="Ingrese un texto alternativo">
                </div>

                <div class="mb-3">
                    <label class="form-label"> Ingrese stock de su producto:</label>
                    <input class="form-control" type="number" formControlName="stock">
                </div>

            </div>

            <!--ACCIONES DEL MODAL-->
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-success" data-bs-dismiss="modal"
                    (click)="agregarProducto()">Guardar</button>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrrar</button>
            </div>
        </div>
    </div>
</div>


<!-- MODAL PARA EDITAR PRODUCTOS -->
<div class="modal fade" id="editarProducto" *ngFor="let productosEdit of coleccionProductos" tabindex="-1"
    aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Edite el sigueinte producto</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <!-- cuerpo del modal -->
            <div [formGroup]="producto" class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Ingrese el nombre del producto</label>
                    <input class="form-control" type="text" formControlName="nombre"
                        placeholder="{{productosEdit.nombre}}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ingrese descripcion del producto</label>
                    <input class="form-control" type="text" formControlName="descripcion"
                        placeholder="{{productosEdit.descripcion}}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ingrese el precio del producto</label>
                    <input class="form-control" type="number" formControlName="precio"
                        placeholder="{{productosEdit.precio}}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Seleccione una categoria</label>
                    <select class="form-control" class="form-select" formControlName="categoria">
                        <option selected>Elija una opcion</option>
                        <option value="labiales">Labiales</option>
                        <option value="ojos">Ojos</option>
                        <option value="rostro">Rostro</option>
                        <option value="unas">Uñas</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ingrese una imagen</label>
                    <input class="form-control" type="text" formControlName="imagen"
                        placeholder="{{productosEdit.imagen}}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ingrese un texto alternativo</label>
                    <input class="form-control" type="text" formControlName="alt" placeholder="{{productosEdit.alt}}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ingrese stock del producto</label>
                    <input class="form-control" type="number" formControlName="stock"
                        placeholder="{{productosEdit.stock}}">
                </div>
            </div>

            <!--ACCIONES DEL MODAL-->
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-success" data-bs-dismiss="modal"
                    (click)="editarProducto()">Guardar</button>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>


<!-- Modal -->
<div class="modal fade" *ngIf="modalVisibleProducto" id="eliminarProducto" tabindex="-1"
    aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Esta seguro de eliminar el producto</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body modal-nombre">
                {{productoSeleccionado.nombre}}
                <img src="{{productoSeleccionado.imagen}}" alt="{{productoSeleccionado.alt}}">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
                    aria-label="Cerrar">Cerrar</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                    (click)="borrarProducto()">Borrar</button>
            </div>
        </div>
    </div>
</div>
