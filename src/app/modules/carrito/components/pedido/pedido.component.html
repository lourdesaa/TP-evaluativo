<div class="container">
    <h2>Carrito de compra</h2>
    <div class="">
        <div class="col-lg-4">
            <ul class="list-group">
                <li class="list-group-item" *ngFor="let pedido of productos">
                    {{pedido.cantidad}} {{pedido.producto.nombre}} - ${{pedido.total}}
                    <button class="btn btn-danger" (click)="quitarPedido(pedido)"></button>

                </li>
            </ul>
        </div>
    </div>
</div>
