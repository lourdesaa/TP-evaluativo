<div class="container mt-5">
    <h2 class="text-center mb-4">Contáctanos</h2>
    
    <div class="row">
      <!-- Información de contacto -->
      <div class="col-md-6">
        <div class="contact-info">
          <h4>Información de Contacto</h4>
          <ul>
            <li><strong>Dirección:</strong>Chichinales 1844, Cipolletti, Rio Negro </li>
            <li><strong>Teléfono:</strong> 299 777 1234</li>
            <li><strong>Email:</strong> lightneat@gmail.com</li>
          </ul>
        </div>

        <!-- Mapa de Google -->
        <section class="map-container">
            <h2 class="map-title">Ubicación</h2>
            <iframe id="map" class="map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d652.6365383590887!2d-67.97388626213495!3d-38.91300369306436!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x960a30b82ed2fcdd%3A0x25ede90964a85619!2sChichinales%201844%2C%20R8324%20Cipolletti%2C%20R%C3%ADo%20Negro!5e0!3m2!1ses!2sar!4v1732154769932!5m2!1ses!2sar"></iframe>
          </section>

      </div>
  
      <!-- Formulario de contacto -->
      <div class="col-md-6">
        <form action="#" method="post" class="contact-form">
          <div class="mb-3">
            <label for="name" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="name" placeholder="Tu nombre" required>
          </div>
          
          <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="Tu correo" required>
          </div>
          
          <div class="mb-3">
            <label for="subject" class="form-label">Asunto</label>
            <input type="text" class="form-control" id="subject" placeholder="El asunto de tu mensaje" required>
          </div>
          
          <div class="mb-3">
            <label for="message" class="form-label">Mensaje</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Escribe tu mensaje aquí" required></textarea>
          </div>
          
          <div class="text-center">
            <button type="submit" class="btn btn-rosa">Enviar mensaje</button>
          </div>
        </form>
      </div>
    </div>
  </div>
