<div class="container">
  <h1 class="section-title">Productos destacados</h1>
  <div class="row">
    <div *ngFor="let i of info" class="col-lg-3 col-6">
      <div class="card-container">
        <mat-card class="card">
          <mat-card-header>
            <mat-card-title class="product-name">{{i.nombre}}</mat-card-title>
          </mat-card-header>
          <img class="card-img" mat-card-image src="{{i.imagen}}" alt="{{i.alt}}">
          <!-- <mat-card-content>
            <p class="product-description">{{i.descripcion}}</p>
          </mat-card-content> -->
          <mat-card-actions>
            <button class="btn-arrow" (click)="mostrarVer(i)">
              {{i.categoria}} <span>&rarr;</span>
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
  </div>
</div>

<!-- Modal para ver más información -->
<div class="modal fade" id="modalCard" *ngIf="modalVisible" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
      <div class="modal-content">

          <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">{{productoSeleccionado.nombre}}</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
              <img src="{{productoSeleccionado.imagen}}" alt="{{productoSeleccionado.alt}}" width="100px">

              <div class="mb-3">
                  {{productoSeleccionado.descripcion}}
              </div>

              <div class="mb-3">
                  {{productoSeleccionado.precio}}
              </div>
          </div>

          <div class="modal-footer">
              <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Agregar al carrito</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
      </div>
  </div>
</div>
