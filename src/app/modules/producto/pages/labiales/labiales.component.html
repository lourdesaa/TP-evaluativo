<div class="container">
    <div class="row">
        <h1>Labiales</h1>
        <div id="carouselExample" class="carousel slide">
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img class="imagen-carrusel" src="https://cl.todomoda.com/media/wysiwyg/TMB_BANNER_-_categoria_beauty_1__5.jpg" class="d-block w-100" alt="...">
              </div>
              <div class="carousel-item" *ngFor="let producto of productoCarrusel">
                <img src="{{producto.imagen}}" class="d-block w-100" alt="{{producto.alt}}">
              </div>
            </div>
          </div>
        <div class="col">
            <app-card
            (productoAgregado)="productoAnadido($event)"(productoReciente)="product"></app-card>
        </div>
    </div>
</div>
